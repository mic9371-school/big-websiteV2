name: Fix LFS checkout & track large pointers

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix-lfs:
    runs-on: ubuntu-latest
    env:
      THRESHOLD_BYTES: 104857600 # 100 MiB
    steps:
      - name: Checkout (do not fetch LFS objects)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install git-lfs (for git lfs track)
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install --local

      - name: Find LFS pointer files and their declared sizes
        id: scan
        run: |
          set -euo pipefail
          threshold=${THRESHOLD_BYTES}
          results=""
          while IFS= read -r -d '' f; do
            # Only consider tracked files that exist in the checkout
            if [ ! -f "$f" ]; then
              continue
            fi
            if grep -q "version https://git-lfs.github.com/spec/v1" "$f"; then
              size_line=$(grep '^size ' "$f" || true)
              size=$(echo "$size_line" | awk '{print $2}')
              if [ -n "$size" ] && [ "$size" -ge "$threshold" ]; then
                echo "LFS pointer >= threshold: $f (size=$size)"
                results="${results}${f}||${size}\n"
              fi
            fi
          done < <(git ls-files -z)
          if [ -z "$results" ]; then
            echo "::set-output name=found::false"
          else
            # encode output (simple)
            printf "%b" "$results" > /tmp/lfs-large-list.txt
            echo "::set-output name=found::true"
            echo "::set-output name=list-path::/tmp/lfs-large-list.txt"
          fi

      - name: Ensure large pointers are tracked in .gitattributes and push
        if: steps.scan.outputs.found == 'true'
        run: |
          set -euo pipefail
          file=/tmp/lfs-large-list.txt
          # Detect if this is a PR from a fork. If so, skip push (no write perms).
          is_fork_pr=false
          if [ -n "${{ github.event.pull_request.head.repo.full_name || '' }}" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              is_fork_pr=true
            fi
          fi

          # Build list of paths
          paths=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line%%||*}"
            paths="${paths} \"$path\""
            # Ensure git lfs track uses the literal path
            git lfs track -- "$path" || true
          done < "$file"

          git add .gitattributes

          # re-add the pointer files so the index contains the pointer (we did lfs=false)
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line%%||*}"
            # add pointer file (we can't fetch real object now)
            git add -- "$path" || true
          done < "$file"

          if git diff --staged --quiet; then
            echo "No .gitattributes or index changes to commit."
          else
            git commit -m "ci: auto-track large LFS pointer files [skip ci]" || true
            if [ "$is_fork_pr" = "true" ]; then
              echo "Pull request is from a fork; skipping push (no write perms)."
            else
              # push back to the current branch; determine branch name
              branch="${GITHUB_REF#refs/heads/}"
              if [ -n "${GITHUB_HEAD_REF:-}" ]; then
                branch="${GITHUB_HEAD_REF}"
              fi
              git push origin "HEAD:${branch}"
              echo "Pushed .gitattributes update to ${branch}"
            fi
          fi

      - name: Report nothing to do
        if: steps.scan.outputs.found == 'false'
        run: echo "No large LFS pointers >= ${THRESHOLD_BYTES} bytes found."
